<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Portal | KK TEXMART</title>
  
  <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dwgvvzbvn/image/upload/v1790933307/fbvhveeektcotj2yg5gi.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center p-4 selection:bg-zinc-800">

  <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden text-center">
    
    <!-- ব্যাকগ্রাউন্ড গ্লো -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-zinc-700/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-zinc-700/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="mb-6 relative">
      <div class="w-16 h-16 bg-zinc-800 border border-zinc-700 rounded-2xl mx-auto flex items-center justify-center overflow-hidden mb-3 shadow-md">
        <img src="https://res.cloudinary.com/dwgvvzbvn/image/upload/v1790933307/fbvhveeektcotj2yg5gi.jpg" alt="Logo" class="w-full h-full object-cover">
      </div>
      <h1 class="text-lg font-black text-white tracking-tight uppercase">Admin Console</h1>
      <p class="text-xs text-zinc-400 font-medium">Cloud Identity Security</p>
    </div>

    <!-- গুগল সাইন ইন বাটন -->
    <div class="space-y-4">
      <div class="p-3 bg-zinc-950/60 border border-zinc-800 rounded-xl text-xs text-zinc-400">
        Authorized Emails: <b class="text-zinc-200 block font-mono mt-0.5">kktexmart@gmail.com / kktexmart1@gmail.com</b>
      </div>

      <button type="button" onclick="loginWithGoogle()" id="btnGoogleLogin" class="w-full bg-white hover:bg-zinc-100 text-zinc-950 py-3.5 px-4 rounded-xl font-extrabold text-xs uppercase tracking-wider transition active:scale-95 shadow-md flex items-center justify-center gap-3">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>

      <p class="text-[10px] text-zinc-500 font-medium">
        Strict single-tenant access control enabled.
      </p>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCiK8ublFGr7i8JrzbtW-85C3aaujqMfR0",
      authDomain: "kk-texmart.firebaseapp.com",
      databaseURL: "https://kk-texmart-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kk-texmart",
      storageBucket: "kk-texmart.firebasestorage.app",
      messagingSenderId: "140270212285",
      appId: "1:140270212285:web:a0986584b35194888153d4",
      measurementId: "G-FMSG7WRJK1"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const ALLOWED_ADMIN_EMAILS = ["kktexmart@gmail.com", "kktexmart1@gmail.com"];
    const AUTH_SESSION_KEY = "kk_admin_session_kktexmart";

    // আগে থেকেই লগইন থাকা থাকলে সরাসরি অ্যাডমিনে পাঠাবে
    auth.onAuthStateChanged(user => {
      if (user && ALLOWED_ADMIN_EMAILS.includes(user.email.toLowerCase())) {
        localStorage.setItem(AUTH_SESSION_KEY, 'active_auth_token_' + user.uid);
        window.location.replace(`admin.html${window.location.search}`);
      }
    });

    async function loginWithGoogle() {
      const btn = document.getElementById('btnGoogleLogin');
      btn.disabled = true;
      btn.innerHTML = `<div class="w-4 h-4 border-2 border-zinc-950 border-t-transparent rounded-full animate-spin"></div> <span>Authenticating...</span>`;

      const provider = new firebase.auth.GoogleAuthProvider();

      try {
        const result = await auth.signInWithPopup(provider);
        const user = result.user;

        if (user && ALLOWED_ADMIN_EMAILS.includes(user.email.toLowerCase())) {
          // সফল লগইন: admin.html এর ক্র্যাশ গার্ড পাস করার টোকেন সেভ
          localStorage.setItem(AUTH_SESSION_KEY, 'active_auth_token_' + user.uid);

          Swal.fire({
            icon: 'success',
            title: 'Verified!',
            text: 'Google authentication successful.',
            timer: 1000,
            showConfirmButton: false
          }).then(() => {
            window.location.replace(`admin.html${window.location.search}`);
          });
        } else {
          // অননুমোদিত জিমেইল দিয়ে চেষ্টা করলে সাথে সাথে সাইন আউট
          await auth.signOut();
          localStorage.removeItem(AUTH_SESSION_KEY);
          btn.disabled = false;
          btn.innerHTML = `<span>Sign in with Google</span>`;
          Swal.fire({
            icon: 'error',
            title: 'অননুমোদিত অ্যাকাউন্ট!',
            text: 'শুধুমাত্র অনুমোদিত অ্যাডমিন ইমেইল দিয়ে লগইন করতে পারবেন।'
          });
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `<span>Sign in with Google</span>`;
        Swal.fire({
          icon: 'error',
          title: 'লগইন ব্যর্থ',
          text: err.message
        });
      }
    }
  </script>
</body>
</html>
